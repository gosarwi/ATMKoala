# ATM Loader UEFI menu stored inside limine-uefi-cd.bin (FAT El Torito volume).
# `boot()` resolves to this same FAT volume under UEFI; the menu choices match
# the BIOS-facing hybrid ISO contract while retaining the UEFI-local path.
timeout: 3
serial: yes
serial_baudrate: 115200
interface_branding: ATMKoala v0.9 | ATM Loader

/ATMKoala v0.9 [Graphical — adaptive display]
    protocol: multiboot2
    path: boot():/kernel.bin
    # Limine uses another available graphical mode when this preference is unavailable.
    resolution: 1920x1080x32

/ATMKoala v0.9 [Graphical 1024x768 — manual fallback]
    protocol: multiboot2
    path: boot():/kernel.bin
    resolution: 1024x768x32

/ATMKoala v0.9 [Graphical 640x480 — manual fallback]
    protocol: multiboot2
    path: boot():/kernel.bin
    resolution: 640x480x32

/ATMKoala v0.9 [Text Mode]
    protocol: multiboot2
    path: boot():/kernel.bin
    cmdline: novbe text
    textmode: yes

/ATMKoala v0.9 [Disk Installer — erases selected disk]
    protocol: multiboot2
    path: boot():/kernel.bin
    cmdline: installer
    resolution: 800x600x32
