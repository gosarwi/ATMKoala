# ATMKoala v0.9 Limine boot path.
# The kernel retains its existing Multiboot2 handoff; ATMBOOT and ATMUEFI
# are intentionally independent and are not referenced or modified here.
timeout: 3
serial: yes
serial_baudrate: 115200
interface_branding: ATMKoala v0.9

/ATMKoala v0.9 [Graphical — adaptive display]
    protocol: multiboot2
    path: boot():/boot/kernel.bin
    # Limine uses another available graphical mode when this preference is unavailable.
    resolution: 1920x1080x32

/ATMKoala v0.9 [Graphical 1024x768 — manual fallback]
    protocol: multiboot2
    path: boot():/boot/kernel.bin
    resolution: 1024x768x32

/ATMKoala v0.9 [Graphical 640x480 — manual fallback]
    protocol: multiboot2
    path: boot():/boot/kernel.bin
    resolution: 640x480x32

/ATMKoala v0.9 [Text Mode]
    protocol: multiboot2
    path: boot():/boot/kernel.bin
    cmdline: novbe text
    textmode: yes

/ATMKoala v0.9 [Disk Installer — erases selected disk]
    protocol: multiboot2
    path: boot():/boot/kernel.bin
    cmdline: installer
    resolution: 800x600x32
